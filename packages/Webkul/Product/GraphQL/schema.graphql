"""
Single attribute filter input
"""
input AttributeFilterInput {
    """
    Attribute code to filter by (e.g., 'brand', 'color', 'size')
    """
    attribute: String!

    """
    Value to filter by - can be a single value or array of values
    """
    value: [String!]!

    """
    Operator for filtering: 'eq', 'in', 'like', 'gt', 'lt', 'gte', 'lte'
    Default: 'eq' for single value, 'in' for multiple values
    """
    operator: String
}

"""
Input for products by attribute query with EAV sorting
"""
input ProductsByAttributeEavInput {
    """
    Array of attribute filters
    If empty or not provided, returns all products
    """
    filters: [AttributeFilterInput!]

    """
    Category IDs or slugs
    """
    categories: [String!]

    """
    Minimum price
    """
    min_price: Float

    """
    Maximum price
    """
    max_price: Float

    """
    In stock only
    """
    in_stock: Boolean

    """
    Search term for product name or description
    """
    search: String

    """
    Sort by field
    Can be:
    - Direct columns: id, created_at, updated_at
    - EAV attributes: name, sku, price, quantity, weight, status, views, short_description, description, url_key, new, featured, visible_individually
    """
    sortBy: String = "created_at"

    """
    Sort order: 'asc' for ascending, 'desc' for descending
    """
    sortOrder: String = "desc"

    """
    Items per page
    """
    perPage: Int = 10

    """
    Page number
    """
    page: Int = 1
}

"""
Input for products by attribute query (Simple version)
"""
input ProductsByAttributeInput {
    """
    Attribute code to filter by (e.g., 'brand', 'color', 'size')
    """
    attribute: String!

    """
    Value to filter by (single value)
    """
    value: String!

    """
    Category IDs
    """
    categories: [String!]

    """
    Minimum price
    """
    min_price: Float

    """
    Maximum price
    """
    max_price: Float

    """
    In stock only
    """
    in_stock: Boolean

    """
    Sort by field
    """
    sortBy: String

    """
    Sort order (asc/desc)
    """
    sortOrder: String

    """
    Items per page
    """
    perPage: Int = 10

    """
    Page number
    """
    page: Int = 1
}

extend type Query {
    """
    Get products filtered by a single attribute value
    This is a simplified version for backward compatibility
    """
    productsByAttribute(
        input: ProductsByAttributeInput!
    ): ProductPaginator
        @field(resolver: "Webkul\\Product\\GraphQL\\Queries\\ProductsByAttributeQuery")
}

"""
Pagination information
"""
type PaginatorInfo {
    count: Int!
    currentPage: Int!
    lastPage: Int!
    total: Int!
    perPage: Int!
    hasMorePages: Boolean!
    firstItem: Int
    lastItem: Int
}

"""
Base product fields
"""
interface ProductInterface {
    id: ID!
    name: String
    sku: String
    price: Float
    created_at: String
    updated_at: String
}

"""
Product type definition
"""
type Product implements ProductInterface {
    id: ID!
    name: String
    sku: String
    price: Float
    created_at: String
    updated_at: String
    description: String
    short_description: String
    url_key: String
    new: Boolean
    featured: Boolean
    visible_individually: Boolean
    status: Boolean
    images: [ProductImage!]
    categories: [Category!]
    attribute_values: [AttributeValue!]
}

"""
Product image type
"""
type ProductImage {
    id: ID!
    path: String
    url: String
}

"""
Category type
"""
type Category {
    id: ID!
    name: String
    slug: String
}

"""
Attribute value type
"""
type AttributeValue {
    id: ID!
    attribute_id: ID!
    product_id: ID!
    text_value: String
    integer_value: Int
    float_value: Float
    boolean_value: Boolean
    datetime_value: String
    date_value: String
    json_value: String
}

"""
Product paginator type
"""
type ProductPaginator {
    paginatorInfo: PaginatorInfo!
    data: [Product!]!
}

"""
Available sort fields result
"""
type AvailableSortFieldsResult {
    direct_columns: [String!]!
    eav_attributes: [String!]!
    all_available_fields: [String!]!
    note: String
}

"""
Attribute value count type
"""
type AttributeValueCount {
    value: String!
    label: String!
    product_count: Int!
    option_id: Int
    image_url: String
}

"""
Attribute values with counts result type
"""
type AttributeValuesWithCounts {
    attribute: String!
    values: [AttributeValueCount!]!
    total_values: Int!
}

extend type Query {
    """
    NEW API: Get products filtered by multiple attribute values with EAV-compatible sorting
    This query properly handles sorting by EAV attributes like name, price, etc.
    """
    productsByAttributeEav(
        input: ProductsByAttributeEavInput!
    ): ProductPaginator
        @field(resolver: "Webkul\\Product\\GraphQL\\Queries\\ProductsByAttributeEavQuery")

    """
    Get available sort fields for productsByAttributeEav
    Use this to see what fields you can sort by
    """
    getAvailableSortFields: AvailableSortFieldsResult!
        @field(resolver: "Webkul\\Product\\GraphQL\\Queries\\ProductsByAttributeEavQuery@getAvailableSortFields")

    """
    Get all values for an attribute with product counts
    """
    attributeValuesWithCounts(
        attribute: String!
        locale: String
    ): AttributeValuesWithCounts
        @field(resolver: "Webkul\\Product\\GraphQL\\Queries\\ProductsByAttributeEavQuery@attributeValuesWithCounts")
}
