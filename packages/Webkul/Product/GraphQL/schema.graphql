"""
Single attribute filter input
"""
input AttributeFilterInput {
    """
    Attribute code to filter by (e.g., 'brand', 'color', 'size')
    """
    attribute: String!

    """
    Value to filter by - can be a single value or array of values
    """
    value: [String!]!

    """
    Operator for filtering: 'eq', 'in', 'like', 'gt', 'lt', 'gte', 'lte'
    Default: 'eq' for single value, 'in' for multiple values
    """
    operator: String
}

"""
Input for products by attribute query with EAV sorting
"""
input ProductsByAttributeEavInput {
    """
    Array of attribute filters
    If empty or not provided, returns all products
    """
    filters: [AttributeFilterInput!]

    """
    Category IDs or slugs
    """
    categories: [String!]

    """
    Minimum price
    """
    min_price: Float

    """
    Maximum price
    """
    max_price: Float

    """
    In stock only
    """
    in_stock: Boolean

    """
    Search term for product name or description
    """
    search: String

    """
    Sort by field
    Can be:
    - Direct columns: id, created_at, updated_at
    - EAV attributes: name, sku, price, quantity, weight, status, views, short_description, description, url_key, new, featured, visible_individually
    """
    sortBy: String = "created_at"

    """
    Sort order: 'asc' for ascending, 'desc' for descending
    """
    sortOrder: String = "desc"

    """
    Items per page
    """
    perPage: Int = 10

    """
    Page number
    """
    page: Int = 1
}

"""
Input for products by attribute query (Simple version)
"""
input ProductsByAttributeInput {
    """
    Attribute code to filter by (e.g., 'brand', 'color', 'size')
    """
    attribute: String!

    """
    Value to filter by (single value)
    """
    value: String!

    """
    Category IDs
    """
    categories: [String!]

    """
    Minimum price
    """
    min_price: Float

    """
    Maximum price
    """
    max_price: Float

    """
    In stock only
    """
    in_stock: Boolean

    """
    Sort by field
    """
    sortBy: String

    """
    Sort order (asc/desc)
    """
    sortOrder: String

    """
    Items per page
    """
    perPage: Int = 10

    """
    Page number
    """
    page: Int = 1
}

"""
Pagination information
"""
type PaginatorInfo {
    count: Int!
    currentPage: Int!
    lastPage: Int!
    total: Int!
    perPage: Int!
    hasMorePages: Boolean!
    firstItem: Int
    lastItem: Int
}

"""
Product review type
"""
type ProductReview {
    id: ID!
    title: String
    rating: Int
    comment: String
    created_at: String
    createdAt: String
    product_id: ID
    customer_id: ID
}

"""
Price HTML type
"""
type PriceHtml {
    id: ID
    type: String
    priceHtml: String
    regularPrice: Float
    formattedRegularPrice: String
    finalPrice: Float
    formattedFinalPrice: String
}

"""
Additional data type
"""
type AdditionalData {
    id: ID
    label: String
    value: String
    type: String
}

"""
Customizable option price type
"""
type CustomizableOptionPrice {
    id: ID
    isDefault: Boolean
    isUserDefined: Boolean
    label: String
    price: Float
    productCustomizableOptionId: ID
    qty: Int
    sortOrder: Int
}

"""
Customizable option type
"""
type CustomizableOption {
    id: ID
    label: String
    productId: ID
    type: String
    isRequired: Boolean
    maxCharacters: Int
    supportedFileExtensions: [String]
    sortOrder: Int
    customizableOptionPrices: [CustomizableOptionPrice!]
}

"""
Variant type
"""
type Variant {
    id: ID!
    type: String
    sku: String
    name: String
    price: Float
    parentId: ID
    images: [ProductImage!]
}

"""
Product image type
"""
type ProductImage {
    id: ID!
    type: String
    path: String
    url: String
    productId: ID
}

"""
Category type
"""
type Category {
    id: ID!
    name: String
    slug: String
}

"""
Attribute value type
"""
type AttributeValue {
    id: ID!
    attribute_id: ID!
    product_id: ID!
    text_value: String
    integer_value: Int
    float_value: Float
    boolean_value: Boolean
    datetime_value: String
    date_value: String
    json_value: String
}

"""
Base product fields
"""
interface ProductInterface {
    id: ID!
    name: String
    sku: String
    price: Float
    created_at: String
    updated_at: String
}

"""
Product type definition with all fields
"""
type Product implements ProductInterface {
    # Base fields
    id: ID!
    name: String
    sku: String
    price: Float
    created_at: String
    updated_at: String

    # Additional fields
    type: String
    isInWishlist: Boolean
    isInSale: Boolean
    isSaleable: Boolean
    shareURL: String
    url_key: String
    short_description: String
    description: String
    parentId: ID
    new: Boolean
    featured: Boolean
    visible_individually: Boolean
    status: Boolean

    # Relations
    images: [ProductImage!]
    categories: [Category!]
    attribute_values: [AttributeValue!]
    variants: [Variant!]
    reviews: [ProductReview!]

    # Computed fields
    averageRating: Float
    percentageRating: String
    priceHtml: PriceHtml
    additionalData: [AdditionalData!]
    customizableOptions: [CustomizableOption!]

    urlKey: String @rename(attribute: "url_key")
    shortDescription: String @rename(attribute: "short_description")
    createdAt: String @rename(attribute: "created_at")
    updatedAt: String @rename(attribute: "updated_at")
}

"""
Product paginator type
"""
type ProductPaginator {
    paginatorInfo: PaginatorInfo!
    data: [Product!]!
}

"""
Available sort fields result
"""
type AvailableSortFieldsResult {
    direct_columns: [String!]!
    eav_attributes: [String!]!
    all_available_fields: [String!]!
    note: String
}

"""
Attribute value count type
"""
type AttributeValueCount {
    value: String!
    label: String!
    product_count: Int!
    option_id: Int
    image_url: String
}

"""
Attribute count result type
"""
type AttributeCountResult {
    attribute: String!
    value: String!
    total_products: Int!
}

"""
Attribute values with counts result type
"""
type AttributeValuesWithCounts {
    attribute: String!
    values: [AttributeValueCount!]!
    total_values: Int!
}

extend type Query {
    """
    Get products filtered by a single attribute value
    This is a simplified version for backward compatibility
    """
    productsByAttribute(
        input: ProductsByAttributeInput!
    ): ProductPaginator
        @field(resolver: "Webkul\\Product\\GraphQL\\Queries\\ProductsByAttributeQuery")

    """
    NEW API: Get products filtered by multiple attribute values with EAV-compatible sorting
    This query properly handles sorting by EAV attributes like name, price, etc.
    """
    productsByAttributeEav(
        input: ProductsByAttributeEavInput!
    ): ProductPaginator
        @field(resolver: "Webkul\\Product\\GraphQL\\Queries\\ProductsByAttributeEavQuery")

    """
    Get available sort fields for productsByAttributeEav
    Use this to see what fields you can sort by
    """
    getAvailableSortFields: AvailableSortFieldsResult!
        @field(resolver: "Webkul\\Product\\GraphQL\\Queries\\ProductsByAttributeEavQuery@getAvailableSortFields")

    """
    Get all values for an attribute with product counts
    """
    attributeValuesWithCounts(
        attribute: String!
        locale: String
    ): AttributeValuesWithCounts
        @field(resolver: "Webkul\\Product\\GraphQL\\Queries\\ProductsByAttributeEavQuery@attributeValuesWithCounts")

    """
    DEBUG: Check attribute and value matching
    """
    debugAttribute(
        attribute: String = "brand"
        value: String = "Dior"
    ): JSON
        @field(resolver: "Webkul\\Product\\GraphQL\\Queries\\ProductsByAttributeQuery@debug")

    """
    Get total product count for a specific attribute value
    """
    attributeProductCount(
        attribute: String!
        value: String!
    ): AttributeCountResult
        @field(resolver: "Webkul\\Product\\GraphQL\\Queries\\ProductsByAttributeQuery@attributeProductCount")

    """
    Get all values for an attribute with product counts (legacy)
    """
    attributeValuesWithCountsLegacy(
        attribute: String!
        locale: String
    ): AttributeValuesWithCounts
        @field(resolver: "Webkul\\Product\\GraphQL\\Queries\\ProductsByAttributeQuery@attributeValuesWithCounts")

    """
    DEBUG: Check product relationships
    """
    debugRelationships: JSON
        @field(resolver: "Webkul\\Product\\GraphQL\\Queries\\ProductsByAttributeQuery@debugRelationships")

    """
    DEBUG: Direct SQL query
    """
    debugQuery(
        attribute: String = "brand"
        value: String = "Dior"
    ): JSON
        @field(resolver: "Webkul\\Product\\GraphQL\\Queries\\ProductsByAttributeQuery@debugQuery")
}

"""
The `JSON` scalar type represents JSON values
"""
scalar JSON
