"""
Input for legacy products by attribute query
"""
input ProductsByAttributeInput {
    attribute: String!
    value: String!
    categories: [String!]
    min_price: Float
    max_price: Float
    in_stock: Boolean
    sortBy: String
    sortOrder: String
    perPage: Int = 10
    page: Int = 1
}

"""
Pagination information
"""
type PaginatorInfo {
    count: Int!
    currentPage: Int!
    lastPage: Int!
    total: Int!
    perPage: Int!
    hasMorePages: Boolean!
    firstItem: Int
    lastItem: Int
}

"""
Product paginator type
"""
type ProductPaginator {
    paginatorInfo: PaginatorInfo!
    data: [Product!]!
}

"""
Attribute value count type (used in attributeValuesWithCounts)
"""
type AttributeValueCount {
    value: String!
    label: String!
    product_count: Int!
    option_id: Int
    image_url: String
}

"""
Result for attribute product count
"""
type AttributeCountResult {
    attribute: String!
    value: String!
    total_products: Int!
}

"""
Attribute values with counts result
"""
type AttributeValuesWithCounts {
    attribute: String!
    values: [AttributeValueCount!]!
    total_values: Int!
}

"""
Operators for advanced filtering
"""
enum FilterOperator {
    eq    # Equal
    in    # In array
    gte   # Greater than or equal
    lte   # Less than or equal
    gt    # Greater than
    lt    # Less than
    like  # Like (text search)
}

"""
Single filter condition for advanced filtering
"""
input ProductFilterInput {
    attribute: String!
    value: [String!]!
    operator: FilterOperator = eq
}

"""
Input for the new productsByAttributeEav query
"""
input ProductsByAttributeEavInput {
    filters: [ProductFilterInput!]
    search: String
    categories: [String!]
    min_price: Float
    max_price: Float
    in_stock: Boolean
    sortBy: String = "created_at"
    sortOrder: String = "desc"
    perPage: Int = 10
    page: Int = 1
}

"""
Available sort fields result for debugging
"""
type AvailableSortFieldsResult {
    direct_columns: [String!]!
    eav_attributes: [String!]!
    all_available_fields: [String!]!
    note: String
}

extend type Query {
    # ---------- LEGACY QUERIES (unchanged) ----------
    productsByAttribute(input: ProductsByAttributeInput!): ProductPaginator
        @field(resolver: "Webkul\\Product\\GraphQL\\Queries\\ProductsByAttributeQuery")

    debugAttribute(attribute: String = "brand", value: String = "Dior"): JSON
        @field(resolver: "Webkul\\Product\\GraphQL\\Queries\\ProductsByAttributeQuery@debug")

    attributeProductCount(attribute: String!, value: String!): AttributeCountResult
        @field(resolver: "Webkul\\Product\\GraphQL\\Queries\\ProductsByAttributeQuery@attributeProductCount")

    attributeValuesWithCounts(attribute: String!, locale: String): AttributeValuesWithCounts
        @field(resolver: "Webkul\\Product\\GraphQL\\Queries\\ProductsByAttributeQuery@attributeValuesWithCounts")

    debugRelationships: JSON
        @field(resolver: "Webkul\\Product\\GraphQL\\Queries\\ProductsByAttributeQuery@debugRelationships")

    debugQuery(attribute: String = "brand", value: String = "Dior"): JSON
        @field(resolver: "Webkul\\Product\\GraphQL\\Queries\\ProductsByAttributeQuery@debugQuery")

    # ---------- NEW ADVANCED QUERIES ----------
    productsByAttributeEav(input: ProductsByAttributeEavInput!): ProductPaginator
        @field(resolver: "Webkul\\Product\\GraphQL\\Queries\\ProductsByAttributeEavQuery")

    getAvailableSortFields: AvailableSortFieldsResult!
        @field(resolver: "Webkul\\Product\\GraphQL\\Queries\\ProductsByAttributeEavQuery@getAvailableSortFields")
}
