name: Laravel CI/CD

on:
  push:
    branches:
      - main  # change if your main branch is different

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'  # change if needed
        extensions: mbstring, bcmath, xml, curl, zip, mysql, gd, intl
        ini-values: post_max_size=256M, upload_max_filesize=256M, max_execution_time=300

    - name: Install dependencies
      run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

    - name: Deploy to server
      if: success()
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: 164.92.172.89
        username: root
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        port: 22
        script: |
          cd /var/www/html/Botica-Website-Laravel
          git pull origin main
          composer install --no-dev --optimize-autoloader
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan optimize:clear
          chown -R www-data:www-data storage bootstrap/cache
          chmod -R 775 storage bootstrap/cache
          systemctl reload apache2

